    analysis, and each cell of Theorem B ships with its own witness so that none
    is vacuous. The abstract's shorthand — "the cases m = 2 (reproof), m = 3,
    the cases m > 3, the p-divisibility theorem and the transcendentality
    theorem" — names Theorems A, B, C and 9.1, and each is certified in its full
    form rather than in the compressed one: Theorem B as the single iff
    SZ.sqrt_natCast_mem_S_iff, whose 𝒮 side is the m = 2 cell SZ.sqrtTwo_mem_S;
    Theorem C with both of its branches, not only the m ≡ 1 (mod p) one the
    abstract displays; and the transcendentality theorem as both halves of
    Theorem 9.1, the cardinality bound SZ.continuum_le_mk_witnesses_sqrtThree as
    well as SZ.exists_transcendental_witness_sqrtThree. One clause of Theorem 9.1
    is not a Lean statement of its own: that W ∩ [4/3, 5/3] already has
    cardinality 2^ℵ₀ is assembled the way the paper assembles it, from
    SZ.treeXi_mem_Icc, which puts every constructed witness in that interval, and
    SZ.runXi_treeDigit_injective, which makes them distinct.
    Nothing is assumed from the literature — the covering induction
    is proved rather than cited to [Utz51], and the cells that [Dub06EO] already
    covers are reproved from Mathlib alone, so the capstones carry no citation
    and no cited-literature axiom. Not formalized, and flagged as such in the

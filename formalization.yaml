    Section 8 (the q ≥ 3 volume count and the zonotope obstruction), and the
    remark of Section 5.1 that the selection rule picks the smallest admissible
    offset. None of the three is used anywhere; no proof in the paper refers to
    the thickness of K_m, and the Section 5.1 remark is cross-checked
    numerically instead.

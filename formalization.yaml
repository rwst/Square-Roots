fidelity:
  divergences: >-
    The paper defines 𝒵 by even integral parts, the second of the two equivalent
    forms of [Dub06EO] p. 331; SZ.MahlerZ is that form, with the source's
    quantifier n ≥ 1, although every witness constructed here works from n = 0,
    which is strictly stronger. Theorem A is formalized with two deviations from
    the text. Lemma 2.1 is proved in the sharper form that computes the integral
    part exactly, ⌊t·mˢ⌋ = N·mˢ + Σ_{i<s} d_i·m^{s−1−i}, rather than only up to
    parity; the parity corollary is then a one-line divisibility argument, the
    two orbit values ⌊ξ√3⌋ = 2 and ⌊3ξ⌋ = 4 are instances of it at s = 0, and
    Lemma 3.1 needs no hypothesis relating p to m, since every summand is visibly
    a multiple of p — the hypothesis p ∣ m or p ∣ m−1 is what the telescoping
    induction of Section 3 needs, not what the statement needs. And the real
    ⟨d⟩ is defined as the supremum of the partial sums rather than as the sum of
    a series, which keeps every estimate order-theoretic; the limit description
    is recovered by a single lemma where it is needed. Five further statements
    are formalized in the form the paper's own proof establishes and uses:
    (a) Theorem 4.1 appears as the admissibility claim of its proof
    (SZ.Slice.pick_adm) together with the resulting solution of (3.1) in K
    (SZ.Slice.digitReal_translate), not as the set identity K + √m K = [0,U] —
    the set K is never introduced in Lean, only its digit streams, and the
    inclusion ⊆ is the half nothing uses; (b) Proposition 3.2 is stated for the
    streams the greedy produces rather than for an arbitrary pair solving (3.1);
    (c) Lemma 3.3 is proved under p ≤ U rather than U > p, the endpoint case
    surviving on the irrationality of √m rather than on the length of the
    interval; (d) "composite" in Theorem C is rendered as an explicit
    factorization with both factors > 1, holding from an explicit N on, which is
    Theorem C's own "for every sufficiently large n" and what the abstract
    compresses to "all sufficiently large integral parts"; (e) the cells m ≥ 9 of Theorem B take
    the shorter route through [3,∞) ⊆ 𝒵 (SZ.mem_MahlerZ_of_three_le), the
    printed uniform-greedy proof being formalized too, as
    SZ.sqrt_mem_MahlerZ_of_four_le. Theorems C and 9.1 produce ξ > 0 where the
    paper asks only for ξ ≠ 0. Theorem 9.1's cardinality half is compared in the
    unfolded form SZ.continuum_le_mk_witnesses_sqrtThree, with W written out
    rather than referred to as SZ.witnessSet, for a mechanical reason recorded in
    COMPARATOR.md: Lean lifts a nested proof out of a def's body into an
    auxiliary constant whose name records which declaration of the enclosing
    module first needed it, and a challenge file cannot reproduce such a name
    honestly. The remark of Section 5.1 — that the selection rule picks the
    smallest admissible offset — is neither used nor formalized; the fourth
    cross-check computes both descriptions independently and verifies that they
    agree at every step. Lemma names follow the development, not the paper's
    numbering.

sources:
  - title: "Even integral parts of powers of square roots"
    authors: ["Ralf Stephan"]
    type: paper
    id: "https://doi.org/10.13140/RG.2.2.32215.43682"
    location: "Theorems A, B, C and Theorem 9.1"
    relationship: formalizes
    author_endorsement: participated
    note: >-
      The source of record: its lettered theorems, Theorem 9.1 and Proposition
      2.3 are exactly the ten compared declarations. Paper and formalization come
      from the same collaboration, were developed together, and are mutually
      faithful; Appendix A.1 of the paper indexes the paper's statements by
      Lean identifier and records where the Lean form differs from the printed
      one. Two names of the development are absent from that table: the compared
      form SZ.continuum_le_mk_witnesses_sqrtThree, which the table carries in its
      named-set form SZ.continuum_le_mk_witnessSet, and SZ.treeXi_mem_Icc. A prior-art search was run before any claim, at gate G-1 of
      the project plan (2026-08-20, artifact plans/note-dubD1O5-G1.html): the
      forward-citation lane of [Dub06EO] is complete rather than sampled — five
      citing works in twenty years, all read, with OpenAlex agreeing on the four
      DOI-indexed ones — plus the zbMATH and arXiv title/metadata lanes, a local
      corpus of 271 extracted PDFs, and OEIS, all negative. Two corrections came
      out of the sweep and are carried by the paper: the assertion "√m ∈ 𝒵 for
      each integer m ≥ 4" on p. 332 of [Dub06EO] has no locatable proof, so
      m ∈ {3,5,6,7,8} are the cells requiring one; and the cover lemma at m = 3
      is Utz's 1951 theorem, statement and proof, which must be cited. Nothing
      anticipating Theorems A–C was found, but a search that returns nothing does
      not establish priority: novelty is recorded as unknown.

  - title: "Even and odd integral parts of powers of a real number"
    authors: ["Arturas Dubickas"]
    type: paper
    id: "https://doi.org/10.1017/S0017089506003090"
    location: "Glasgow Math. J. 48 (2006), 331–336; Problem 3 (p. 332), p. 333, Thm 1(i), Thm 2(i)"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      Defines 𝒮 and 𝒵 and poses Problem 3, which Theorem A answers. Two of the
      five cells of Theorem B restate what is proved there — the perfect squares
      (p. 333, ξ = 2) and m ≥ 9 (Theorem 1(i), after Tijdeman) — and both are
      reproved from scratch in SZ/ rather than cited or assumed. Its Theorem 2(i)
      gives 2^{1/q} ∈ 𝒮; the mechanism inside it at q = 2 is isolated as
      Proposition 2.3, again reproved. The four cells m ∈ {5,6,7,8} are asserted
      on p. 332 without proof or reference and no proof could be located, so they
      are treated as requiring one; a reader who knows a source should regard
      them as a reproof.

  - title: "The distance set for the Cantor discontinuum"
    authors: ["W. R. Utz"]
    type: paper
    location: "Amer. Math. Monthly 58 (1951), no. 6, 407–408"
    relationship: background
    author_endorsement: "n/a"
    note: >-
      The covering induction of Section 4 at m = 3 is this theorem, statement and
      proof: his four surviving squares are the four digit pairs of
      SZ.pick_residual_mem. It is proved in SZ/CoverGame.lean and SZ/Slice.lean
      for every base m, modulus p and digit alphabet rather than cited, so the
      formal capstones carry no literature axiom. What Section 4 adds to [Utz51]
      is the even-m half, where the thickness hypothesis fails and no
      Newhouse-type criterion applies. Read in the original at gate G-1; no DOI
      recorded.

  - title: "An unsolved problem on the powers of 3/2"
    authors: ["Kurt Mahler"]
    type: paper
    location: "J. Austral. Math. Soc. Ser. A 8 (1968), 313–321"
    relationship: background
    author_endorsement: "n/a"
    note: >-
      The question that makes the dichotomy interesting: whether 3/2 lies in 𝒵.
      Stated in SZ/Defs.lean as SZ.MahlerQuestion and nowhere assumed; this
      development proves nothing about it.

  - title: "Note on Mahler's 3/2-problem"
    authors: ["Robert Tijdeman"]
    type: paper
    location: "K. Norske Vidensk. Selsk. Skr. 16 (1972), 1–4"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      The construction behind the m ≥ 9 cell, not used as stated: SZ/Tijdeman.lean
      runs an explicit even greedy x₀ = 2, x_{n+1} = 2⌈αxₙ/2⌉ on the
      even-integral-part form, in place of nested intervals on the fractional-part
      form. Cited through [Dub06EO] Thm 1(i); not obtained, and no formalized
      argument depends on its text.

  - title: "Explicit algebraic numbers all whose integer parts of powers are composite"
    authors: ["Seungki Hahn", "Dan Ismailescu", "Gyumin Kim", "Minjae Kim"]
    type: preprint
    id: "arXiv:2608.05309"
    location: "preprint (2026)"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      The designed-α counterpart of Theorem C, where it is the algebraic number
      rather than the multiplier that is constructed. Read at gate G-1; nothing
      is assumed from it and no formalized statement depends on it.

related_formalizations:
  - id: "https://doi.org/10.13140/RG.2.2.20582.79689"
    relationship: builds-on
    note: >-
      The Lean development accompanying the companion paper "Even integral parts
      of powers of quadratic Pisot numbers" (repository directory Even-Integral),
      which classifies 𝒮 versus 𝒵 for the quadratic Pisot numbers. Same author,
      same collaboration, same namespace SZ, and two modules shared byte for
      byte: SZ/Defs.lean (the sets 𝒵 and 𝒮, tail closure, the perfect-square
      cell) and SZ/Tijdeman.lean (the even greedy giving [3,∞) ⊆ 𝒵, which is the
      m ≥ 9 cell here and one of five cells there). Beyond that common base the
      two developments are disjoint: neither one's theorems are used by the
      other, the classes they treat do not overlap (√m is neither Pisot nor
      Salem), and the methods differ — trace recurrences there, restricted-digit
      Cantor arithmetic here.

automation:
  methods:
    - method: agent
      models: ["claude-fable-5"]
      framework: "Claude Code"
      role: >-
        Mathematical discovery. The reduction of the single orbit
        (⌊ξ√mⁿ⌋)_{n≥1} to two coupled base-m orbits, which is where √m² = m
        does the work; the recognition that the resulting equation
        x + √m y = σ is solved by a covering induction on restricted-digit
        streams — Utz's 1951 argument at m = 3, generalized to every base,
        modulus and alphabet; the tail-hygiene analysis that rules out
        non-canonical expansions, which is what the m = 3 cell of Problem 3
        needs and what the classical route does not supply; and the branching
        of the admissible tree that gives continuum-many witnesses.
    - method: agent
      models: ["claude-fable-5", "claude-opus-5"]
      framework: "Claude Code"
      role: >-
        Formalization. All Lean text — the eleven modules of SZ/ and the
        Comparator challenge and solution modules — and the five numerical
        cross-checks in SZ/checks/. Used with the lean-lsp MCP server for goal
        inspection, Mathlib search and tactic trials, and driven turn by turn
        from a written plan, maintained under the author's direction, that fixed
        the targets and the hygiene gates. Both agents also drafted the prose of
        the companion paper, which the author revised and approved; the split of
        drafting between the two models was not logged.
    - method: manual
      models: []
      role: >-
        Direction, review, and authorship of the companion paper. The author
        chose the problem, set the targets and the hygiene gates, steered the
        work turn by turn, revised the drafted prose, reviewed every statement
        against the paper, and takes sole responsibility for the mathematical
        content. The paper's byline is "Ralf Stephan" alone, which is why
        sources records that single author; the collaboration is credited in its
        Acknowledgements. The formalization credit recorded in project.authors
        above is the agents', and those entries are contributor roles, not
        bibliographic authorship.
  spend_usd: "subscription-based usage ($100/month subscription; no separate API spend)"
  notes: >-
    Two independent kinds of check ship with the repository. Five Python
    programs in SZ/checks/ — the files dubD1O5-x3-leanrule.py through
    dubD1O5-x7-thmC.py, which are the five described in Appendix A.2 of the
    paper — share no code with the Lean development or with each other and
    recompute in exact arithmetic: the selection rule at m = 3 with the integer comparator P² ≶ 3Q²
    in ℤ[√3] (2000 steps, 40 decimals of ξ at three truncation depths, ⌊ξ√3ⁿ⌋
    even for n = 1..1000); the general-(p,m) greedy that produced the two printed
    tables, with the gap conditions verified for all p ≤ 8, m < 200 with U > p;
    the admissible tree in ℤ[√3], confirming a full binary tree to depth 10 and
    measuring the factor complexity of the digit stream; the generic cover game at
    the four cells m ∈ {5,6,7,8}; and the same for Theorem C at each row of its
    table. The directory carries four further programs that the paper does not
    describe, from earlier gates of the project plan: d1check2.py and
    dubD1O5-x0/x1/x2, the last of these being the q ≥ 3 grid refutation of
    Section 8 — the section that is not formalized. Second, `lake test` runs
    leanprover/comparator on comparator.json,
    re-deriving the axiom list from a kernel replay of a fresh export of both the
    challenge and the solution. Wall time and hardware were not recorded.

review:
  status: self-assessed
  reviewers:
    - "Ralf Stephan"
  notes: >-
    The author directed the work and checked the statements against the source
    paper. No independent review: the agents that produced the proofs also ran
    the faithfulness passes, and no external referee has read the development or
    the paper.

limitations:
  - >-
    The compared theorems depend on propext, Classical.choice and Quot.sound and
    nothing else. There is no sorry outside the deliberate placeholders in
    Challenge.lean, no project-defined axiom and no native_decide. Challenge.lean
    fixes no definition holes, so no compared statement can be hollowed out by a
    definition value supplied elsewhere.
  - >-
    Novelty is unknown. The G-1 prior-art search found no anticipation of
    Theorems A–C, but it has residual limits: the recreational lane is sampled
    (OEIS) rather than exhausted, so a problem column carrying a ξ-design puzzle
    is not excluded; part of one survey remains unseen; and the claim that no
    proof exists in print for the cells m ∈ {5,6,7,8} is a statement about the
    literature that could be reached, phrased throughout as "we could not locate
    a proof", never as "no proof exists". The abstract's "the first there with
    a proof that are neither rational nor Pisot nor Salem" is to be read in the
    same key: [Dub06EO] p. 332 asserts √m ∈ 𝒵 for every m ≥ 4, which covers
    these four cells, so what is new about them is the proof and not the
    assertion.
  - >-
    Not formalized: the thickness computation of Section 4.1, all of Section 8
    (the volume count (8.1) for α = m^{1/q} with q ≥ 3, the zonotope obstruction
    and the grid refutations at (m,q) = (5,3), (7,3), (13,4)), and the remark of
    Section 5.1 that the selection rule picks the smallest admissible offset.
    None is used by any proof; the last is cross-checked numerically instead.
  - >-
    Mahler's question stays open, and so does the arithmetic nature of the named
    witness ξ = 1.34160899796… of Theorem A: Theorem 9.1 gives transcendental
    witnesses in abundance but says nothing about that one. Questions 9.3–9.5 —
    the Hausdorff dimension of the witness set, the membership of 3^{1/3}, and
    the Lebesgue measure of 𝒵 ∩ (1,3) — are open.
  - >-
    SZ/ proves more than is compared: the individual cells m ∈ {5,6,7,8} of
    Theorem B, the corollary that 𝒵 meets (2,3), the four (p,m) rows of the table
    of Section 7, the explicit orbit values ⌊ξ√3⌋ = 2 and ⌊3ξ⌋ = 4, and the whole
    general-(m,p,alphabet) machinery of SZ/Slice.lean and SZ/SliceHygiene.lean are
    in the repository but not named in comparator.json.

alignment:
  namespace: "SZ"
  statements:
    # --- the ten compared declarations ---
    - source: "Proposition 2.3: √2 ∈ 𝒮 (the whole 𝒮 side of Theorem B)"
      lean: "SZ.sqrtTwo_mem_S"
      module: "Challenge (statement), Solution / SZ.SqrtTwo (proof)"
      status: proved
      note: >-
        The one base whose restricted-digit set collapses to a point: D₂ = {0},
        so there is no Cantor set to intersect. The mechanism inside
        [Dub06EO] Thm 2(i), isolated and reproved.
    - source: "Theorem A: √3 ∈ 𝒵, answering [Dub06EO] Problem 3"
      lean: "SZ.sqrtThree_mem_MahlerZ"
      module: "Challenge (statement), Solution / SZ.SqrtThree (proof)"
      status: proved
      note: >-
        The witness is the explicit ξ = (4 + ⟨a⟩)/3 = 1.3416089979611266516…
        built by the cover greedy from the target σ = 3√3 − 4; the orbit begins
        2, 4, 6, 12, 20, 36, 62, 108, 188, 326.
    - source: "Theorem A, complementary form: √3 ∉ 𝒮"
      lean: "SZ.sqrtThree_notMem_S"
      module: "Challenge (statement), Solution / SZ.SqrtThree (proof)"
      status: proved
      note: "Stated separately so the reader need not unfold the set difference."
    - source: "Theorem B: for an integer m ≥ 2, √m ∈ 𝒮 if and only if m = 2"
      lean: "SZ.sqrt_natCast_mem_S_iff"
      module: "Challenge (statement), Solution / SZ.Cells (proof)"
      status: proved
      note: >-
        Proved cell by cell: m = 2 (Proposition 2.3), the perfect squares,
        m = 3 (Theorem A), m ∈ {5,6,7,8}, and m ≥ 9. Both directions from
        scratch, so the statement carries no citation.
    - source: "Theorem B, the cells m ≥ 9 (= [Dub06EO] Thm 1(i), after Tijdeman)"
      lean: "SZ.mem_MahlerZ_of_three_le"
      module: "Challenge (statement), Solution / SZ.Tijdeman (proof)"
      status: proved
      note: >-
        Certified in the sharper form 3 ≤ α → α ∈ 𝒵, for every real α, by an
        explicit even greedy x₀ = 2, x_{n+1} = 2⌈αxₙ/2⌉ rather than nested
        intervals. Reproved, not cited.
    - source: "Theorem B by the printed proof: the uniform greedy at every non-square m ≥ 4"
